{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add an expense</h1>
            <p class="auth-subtitle">Record what you spent</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="0.00"
                           step="0.01" min="0.01" max="10000000"
                           value="{{ form.get('amount', '') }}"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {% if not form.get('category') %}selected{% endif %}>Choose a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}" {% if form.get('category') == category %}selected{% endif %}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" max="{{ latest_date }}"
                           value="{{ form.get('date', '') }}"
                           {% if fresh_form %}data-default-to-local-today{% endif %}
                           required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="label-optional">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Grocery run"
                           maxlength="200"
                           value="{{ form.get('description', '') }}">
                </div>
                <button type="submit" class="btn-submit">Add expense</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Cancel</a>
        </p>

    </div>
</section>

{% endblock %}

{% block scripts %}
<script>
    // The server can't know the user's timezone, so use the browser's own "today"
    // for the latest selectable date and, on a fresh form, for the default date.
    (function () {
        var input = document.getElementById("date");
        var now = new Date();
        var localToday = [
            now.getFullYear(),
            String(now.getMonth() + 1).padStart(2, "0"),
            String(now.getDate()).padStart(2, "0"),
        ].join("-");

        input.max = localToday;
        if (input.hasAttribute("data-default-to-local-today")) {
            input.value = localToday;
        }
    })();
</script>
{% endblock %}
