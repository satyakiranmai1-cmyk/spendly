{% extends "base.html" %}

{% block title %}Your profile — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Your profile</h1>
            <p class="auth-subtitle">Account details</p>
        </div>

        <div class="auth-card">
            <div class="form-group">
                <label>Name</label>
                <p>{{ user.name }}</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <p>{{ user.email }}</p>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-tile">
                <span class="mock-label">Total spent</span>
                <span class="mock-total">${{ "%.2f"|format(summary.total_spent) }}</span>
            </div>
            <div class="stat-tile">
                <span class="mock-label">Expenses logged</span>
                <span class="mock-total">{{ summary.expense_count }}</span>
            </div>
        </div>

        <a href="{{ url_for('add_expense') }}" class="btn-primary">Add expense</a>

    </div>
</section>

{% endblock %}
